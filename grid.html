<!DOCTYPE html>
<html>

<head>
  <title>Grid Practice</title>
</head>

<body style ="padding-bottom: 1000px;">
  <div style="
      display: grid;
      grid-template-columns: 100px 100px ;
      ">
    <div style="background-color: lightblue;">Div1 </div>
    <div style="background-color:lightpink">Div2 <p>text</p></div>
  </div>
  <div style="
    margin-top: 20px;
      display: grid;
      grid-template-columns: 100px 100px 100px;
      ">
    <div style="background-color: lightblue;">100 </div>
    <div style="background-color:lightpink">100<p>text</p></div>
    <div style="background-color: lightblue;">200 </div>
    <div style="background-color:lightpink">100</div>
  </div>
  <div style="
    margin-top: 20px;
      display: grid;
      grid-template-columns: 100px 1fr;
      ">
    <div style="background-color: lightblue;">100 </div>
    <div style="background-color:lightpink">1fr</div>
  </div>
  <div style="
    margin-top: 20px;
      display: grid;
      grid-template-columns: 100px 1fr 2fr;
      ">
    <div style="background-color: lightblue;">100 </div>
    <div style="background-color:lightpink">1fr</div>
    <div style="background-color: lightblue;">2fr</div>
  </div>
  <div style="
    margin-top: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap : 10px;
      row-gap : 40px;
      ">
<div style="background-color:lightblue; height: 200px;">Div1 </div>
<div style="background-color:lightpink; height: 200px;">Div2</div>
<div style="background-color:lightblue; height: 200px;">Div1 </div>
<div style="background-color:lightpink; height: 200px;">Div2</div>
<div style="background-color:lightblue; height: 200px;">Div1 </div>
<div style="background-color:lightpink; height: 200px;">Div2</div>


  </div>
</body>

</html>
